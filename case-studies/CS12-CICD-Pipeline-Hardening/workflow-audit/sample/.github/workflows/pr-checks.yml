# Deliberately insecure sample workflow for workflow_audit.py. Do not use.
name: PR checks
on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: tj-actions/changed-files@v45
      - uses: reviewdog/action-setup@v1
      - name: Echo title
        run: echo "Checking ${{ github.event.pull_request.title }}"
      - name: Build
        run: npm install && npm test
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  deploy:
    uses: example-org/shared/.github/workflows/deploy.yml@main
    secrets: inherit
