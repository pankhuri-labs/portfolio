<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.home %}<title>{{ site.title }} · Security Product &amp; Programme Leader</title>{% else %}<title>{{ page.title | default: site.title }} · {{ site.title }}</title>{% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body{% if page.home %} class="home"{% endif %}>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="{{ '/' | relative_url }}">PANKHURI MISHRA</a>
      <nav>
        <a href="{{ '/' | relative_url }}#impact">Impact</a>
        <a href="{{ '/' | relative_url }}#work">Work</a>
        <a href="{{ '/' | relative_url }}#case-studies">Case studies</a>
        <a href="{{ '/' | relative_url }}#career">Career</a>
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ '/' | relative_url }}#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap content">
    {{ content }}
  </main>
  <footer class="sitefoot">
    <div class="wrap foot-in">
      <span>Pankhuri Mishra · Technology Product Management</span>
      <span><a href="https://www.linkedin.com/in/pankhurimishra/">LinkedIn</a> · <a href="https://github.com/pankhuri-labs">GitHub</a></span>
    </div>
  </footer>
</body>
</html>
